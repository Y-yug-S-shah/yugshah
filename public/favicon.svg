<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="agent-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9ed" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#b6c0c5" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="agent-ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3c9a8" />
      <stop offset="100%" stop-color="#a68a70" />
    </linearGradient>
    <filter id="milo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="80" height="80" rx="22" fill="#0d1117" />
  <rect width="78" height="78" x="1" y="1" rx="21" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45" />
  <g filter="url(#milo-shadow)">
    <!-- Ears -->
    <path d="M19 30 12 16q-2-5 3-5l14 11m22 8 5-15q2-5 6-2l7 11" fill="url(#agent-ear)" stroke="#86755f" stroke-width="2" stroke-linejoin="round" />
    <!-- Visor / Body -->
    <rect x="16" y="20" width="48" height="38" rx="17" fill="url(#agent-glass)" stroke="#8e9592" stroke-width="1.5" />
    <!-- Specular highlight -->
    <path d="M21 30q3-8 12-8h15" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="2.2" opacity="0.95" />
    <!-- Eyes -->
    <circle cx="30" cy="39" r="3.2" fill="#2d333b" />
    <circle cx="50" cy="39" r="3.2" fill="#2d333b" />
    <!-- Smile -->
    <path d="M35 48q5 4 10 0" fill="none" stroke="#8b725e" stroke-linecap="round" stroke-width="2" />
    <!-- Cheeks -->
    <circle cx="23" cy="45" r="3.2" fill="#e89882" opacity="0.65" />
    <circle cx="57" cy="45" r="3.2" fill="#e89882" opacity="0.65" />
    <!-- Legs -->
    <path d="M31 58v7m18-7v7" stroke="#787f7c" stroke-linecap="round" stroke-width="4.5" />
    <path d="m31 65-3 5m21-5 3 5" fill="none" stroke="#727876" stroke-linecap="round" stroke-width="3.5" />
  </g>
</svg>
